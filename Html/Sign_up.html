<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_sign_in.css">
    <title>Sign up</title>
</head>
<body>
    <div class="box-form">
        <div class="left"> 
            <div class="overlay">
            <h1>Sight Challenge</h1>
            <p>Sustainable Development Goal is about creating a world free of hunger<br>So what do you say about helping us!</p>
            <span>
                <p>login with social media</p>
                <button class="social-signin facebook">Log in with facebook</button>
                <button class="social-signin twitter">Log in with Twitter</button>
                <button class="social-signin google">Log in with Google+</button>
            </span>
            </div>
        </div>
        <div class="right">
          <h1>Sign Up</h1>
          <div class="inputs">
              <input type="text" placeholder="user name">
              <br>
              <input type="email" placeholder="name@gmail.com">
              <br>
              <input type="password" placeholder="password">
              <br>
              <input type="password" placeholder="Repeat password">
              <br><br>
              <select name="adress" class="adress" aria-placeholder="adress">
                <option>Tunis</option>
                <option>Bizerte</option>
                <option>Sfax</option>
                <option>Sousse</option>
                <option>Beja</option>
                <option>Mestir</option>
              </select>
          </div>

          <br><br>
          <br>
          <a href="index.html"><button>Sign Up</button></a>
      </div>
      
  </div>
        
    </div>
</body>
</html>
